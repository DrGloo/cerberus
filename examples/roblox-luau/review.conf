# review.conf as used by the Roblox game this tooling was extracted from.
# Luau under src/, linted with selene before the model sees it. Plain
# KEY=VALUE data (see review.conf.example); an environment value wins.
REVIEW_MODEL=claude-sonnet-5
REVIEW_SOURCE_DIRS=src
REVIEW_EXTRA_IGNORE="openspec/* docs/*"
# selene errors (parse failures, undefined globals) block; warnings pass.
REVIEW_LINT_CMD="selene --allow-warnings --quiet"
