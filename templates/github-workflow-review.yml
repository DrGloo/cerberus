name: Review hook checks

# Drop this into .github/workflows/ of a repository that installed the hooks.
# No model review in CI (no API key by design): it only checks that the hook
# files are well-formed and their guard and backstop invariants hold. The AI
# review itself runs locally at commit and push time.
on:
  pull_request:

jobs:
  hook-selfcheck:
    name: Hook lint and probe suites (no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Syntax-check hook scripts
        run: |
          for f in .githooks/pre-commit .githooks/post-commit .githooks/pre-push \
                   .githooks/lib/review-core.sh .githooks/lib/no-bypass-guard.sh \
                   scripts/review.sh scripts/review-regress.sh \
                   scripts/guard-probes.sh scripts/backstop-probes.sh; do
            bash -n "$f" && echo "OK $f"
          done
      - name: Hooks are executable
        run: |
          for f in .githooks/pre-commit .githooks/post-commit .githooks/pre-push .githooks/lib/no-bypass-guard.sh; do
            [ -x "$f" ] || { echo "NOT EXECUTABLE: $f (git ignores a non-executable hook)"; exit 1; }
          done
      - name: Guard probes
        run: bash scripts/guard-probes.sh
      - name: Backstop probes
        run: bash scripts/backstop-probes.sh
